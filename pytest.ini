[pytest]
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
markers =
    adn: ADN user examples
    jefeoficina: jefe de oficina examples
    loguin: login scenarios
    funcional: functional scenarios tagged in Spanish
    smoke: fast real-device or emulator smoke checks
    functional: functional application scenarios
    e2e: end-to-end scenarios
    unit: isolated unit tests
