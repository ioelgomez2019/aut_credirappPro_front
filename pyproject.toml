[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automationcredirapppro"
version = "0.1.0"
description = "Android UI automation for Katamobile using Appium and pytest-bdd"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Appium-Python-Client",
    "selenium",
    "pytest",
    "pytest-bdd",
    "allure-pytest-bdd",
    "pyodbc",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "core*", "modules*", "flows*", "services*", "repositories*", "tests*"]
